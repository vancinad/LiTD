litd {
  http {
    host = "127.0.0.1"
    port = 8080
  }

  mongodb {
    # Default development values; override via env vars if needed
#    uri = "mongodb://localhost:27017"
#    database = "test"
    uri = ${LITD_DB_CONNECT_STRING}
    database = ${LITD_DB_DBNAME}
  }

  auth {
    encryptionKeyBase64 = ${?LITD_AUTH_ENCRYPTION_KEY_BASE64}
    encryptionKeyBase64 = "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
    stateTtlSeconds = 300
    membershipCacheTtlSeconds = 300

    session {
      cookieName = "litd_session"
      secureCookie = false
      maxAgeSeconds = 2592000
    }

    lichess {
      baseUrl = "https://lichess.org"
      clientId = ${?LITD_LICHESS_CLIENT_ID}
      clientId = "litd-dev-client"
      clientSecret = ${?LITD_LICHESS_CLIENT_SECRET}
      clientSecret = "litd-dev-secret"
      redirectUri = ${?LITD_LICHESS_REDIRECT_URI}
      redirectUri = "http://localhost:8080/auth/lichess/callback"
      scope = "preference:read team:read challenge:write"
      requestTimeoutMillis = 5000
      retryCount = 3
    }
  }

  challengeWorker {
    enabled = true
    pollIntervalSeconds = 20
    batchSize = 100
  }
}
